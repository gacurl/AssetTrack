<!-- file: assettrack/intake/templates/splash.html -->
{% extends "base.html" %}

{% block title %}AssetTrack — Login{% endblock %}
{% block page_heading %}{% endblock %}

{% block extra_head %}
  <style>
    .splash_shell {
      min-height: calc(100vh - 3rem);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.25rem;
      padding: 1.75rem 0 1.5rem;
      background: #fbfbf8;
      overflow-x: clip;
    }

    .top_title {
      width: 100%;
      text-align: center;
      font-weight: 900;
      letter-spacing: 0.03em;
      font-size: clamp(1.6rem, 2.4vw, 2.2rem);
      color: #12151c;
      margin-top: 0.35rem;
    }

    .card {
      width: min(480px, 100%);
      max-width: 92vw;
      background: #fff;
      border: 1px solid #e2e7f0;
      border-radius: 16px;
      box-shadow: 0 14px 30px rgba(16, 24, 40, 0.10);
      padding: 1.5rem 1.35rem 1.25rem;
      margin: 0 auto;
    }

    .card form {
      width: 100%;
      max-width: 440px;
      margin: 0 auto;
    }

    .splash-login-title {
      text-align: center;
      font-weight: 800;
      letter-spacing: 0.20em;
      margin: 0 0 1rem 0;
      color: #243447;
      font-size: 1.05rem;
    }

    .splash-field {
      margin: 0 0 0.95rem 0;
    }

    .splash-label {
      display: block;
      text-align: center;
      font-weight: 800;
      letter-spacing: 0.20em;
      margin: 0 0 0.4rem 0;
      color: #1f2a37;
      font-size: 0.85rem;
    }

    .splash-underline {
      height: 2px;
      width: 118px;
      margin: 0 auto 0.75rem auto;
      background: #ff4b1f;
      border-radius: 999px;
    }

    .splash-input {
      width: 100%;
      box-sizing: border-box;
      font-size: 1rem;
      padding: 0.85rem 0.95rem;
      border-radius: 10px;
      border: 1px solid #d9e0eb;
      outline: none;
      background: #fbfcfe;
      color: #14202f;
    }
    .splash-input::placeholder { color: #98a4b3; }
    .splash-input:focus {
      border-color: #b8c7df;
      box-shadow: 0 0 0 3px rgba(19, 78, 138, 0.08);
      background: #fff;
    }

    .splash-button {
      width: 100%;
      box-sizing: border-box;
      margin-top: 0.35rem;
      padding: 0.92rem 1rem;
      font-size: 1.05rem;
      font-weight: 900;
      letter-spacing: 0.18em;
      color: #fff;
      background: #ff4b1f;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 10px 18px rgba(255, 75, 31, 0.22);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
    }
    .splash-button:hover { background: #f24319; }
    .splash-button .btn_label {
      flex: 1 1 auto;
      text-align: center;
      padding-left: 1.2rem;
    }
    .splash-button .btn_arrow {
      flex: 0 0 auto;
      font-size: 1.35rem;
      line-height: 1;
      margin-left: auto;
      margin-right: 0;
      letter-spacing: 0;
    }

    .splash_error {
      margin: 0 0 0.9rem 0;
      padding: 0.55rem 0.75rem;
      border-radius: 8px;
      border: 1px solid #f2c2bc;
      background: #fff1ef;
      color: #8b2417;
      font-size: 0.9rem;
      text-align: center;
    }

    .bottom_band {
      margin-top: auto;
      margin-left: auto;
      margin-right: auto;
      width: min(820px, 100%);
      max-width: 94vw;
      box-sizing: border-box;
      background: #ffffff;
      border: 1px solid #e7e7e2;
      border-radius: 16px;
      box-shadow: 0 10px 24px rgba(18, 21, 28, 0.08);
      padding: 1rem 1.1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      overflow: hidden;
    }

    .bottom_left {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      min-width: 0;
      position: relative;
      flex: 1 1 auto;
      padding: 0.25rem 0 0.45rem;
    }

    .bottom_left::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0.1rem;
      height: 1px;
      background: #cfd6e0;
      opacity: 0.28;
    }

    .bottom_left .stripe {
      display: none;
    }

    .bottom_left .wordmark {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: baseline;
      gap: 0.3rem;
      min-width: 0;
      line-height: 1;
      padding-right: 0.05rem;
      transform: none;
      white-space: nowrap;
    }

    .bottom_left .wordmark_asset {
      font-size: clamp(0.68rem, 0.95vw, 0.78rem);
      font-weight: 400;
      color: #626b78;
      letter-spacing: 0.02em;
      text-transform: none;
      margin: 0;
    }

    .bottom_left .wordmark_track {
      font-size: 0.95rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      white-space: nowrap;
      margin: 0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 280px;
      line-height: 1;
      padding: 6px 28px;
      border-radius: 10px;
      background-image: linear-gradient(
        90deg,
        #ff4a1a 0%,
        #8e4a26 100%
      );
      background-repeat: no-repeat;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.22);
    }

    .bottom_right {
      flex: 0 0 auto;
      width: clamp(96px, 16vw, 150px);
      height: clamp(44px, 7vw, 70px);
      display: grid;
      place-items: center;
      overflow: hidden;
      align-self: center;
    }

    .bottom_right svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .deco_mark path,
    .deco_mark line,
    .deco_mark circle,
    .deco_mark rect {
      fill: none;
      stroke: rgba(18, 32, 47, 0.78);
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .deco_mark text {
      fill: rgba(18, 32, 47, 0.92);
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
      letter-spacing: 1px;
    }

    @media (max-width: 640px) {
      .splash_shell {
        gap: 0.95rem;
        padding: 1rem 0 1rem;
      }
      .top_title {
        font-size: clamp(1.35rem, 7vw, 1.7rem);
        margin-top: 0.15rem;
      }
      .card {
        max-width: 94vw;
        padding: 1.05rem 0.95rem 0.95rem;
        border-radius: 14px;
      }
      .card form {
        max-width: 100%;
      }
      .splash-login-title {
        font-size: 0.95rem;
        margin-bottom: 0.8rem;
      }
      .splash-label {
        font-size: 0.78rem;
      }
      .splash-input {
        font-size: 0.95rem;
        padding: 0.75rem 0.8rem;
      }
      .splash-button {
        font-size: 0.95rem;
        padding: 0.8rem 0.85rem;
      }
      .splash-button .btn_label {
        padding-left: 0.65rem;
      }
      .bottom_band {
        width: min(820px, 100%);
        max-width: 94vw;
        padding: 0.75rem 0.75rem;
        gap: 0.75rem;
        align-items: flex-end;
      }
      .bottom_left .stripe {
        display: none;
      }
      .bottom_left::after {
        right: 0.35rem;
      }
      .bottom_right {
        width: clamp(88px, 22vw, 122px);
        height: clamp(38px, 9vw, 58px);
      }
    }

    @media (max-width: 420px) {
      .bottom_band {
        gap: 0.55rem;
        padding: 0.65rem;
      }
      .bottom_left {
        gap: 0.45rem;
        padding: 0.18rem 0 0.34rem;
      }
      .bottom_left .wordmark { gap: 0.22rem; }
      .bottom_left .wordmark_track {
        padding: 0.26rem 0.72rem 0.24rem;
        border-radius: 6px;
      }
      .bottom_right {
        width: 84px;
        height: 36px;
      }
    }

  </style>
{% endblock %}

{% block content %}
  <div class="page splash_shell">
    <div class="top_title">AssetTrack</div>

    <div class="card" role="region" aria-label="Login">
      <h2 class="splash-login-title">LOGIN</h2>

      {% if error %}
        <div class="splash_error">{{ error }}</div>
      {% endif %}

      <form method="post" action="/">
        <div class="splash-field">
          <label class="splash-label" for="name">NAME</label>
          <div class="splash-underline"></div>
          <input
            class="splash-input"
            id="name"
            name="username"
            type="text"
            placeholder="Enter your name"
            autocomplete="username"
            required
            autofocus
          />
        </div>

        <div class="splash-field">
          <label class="splash-label" for="password">PASSWORD</label>
          <div class="splash-underline" style="width: 154px;"></div>
          <input
            class="splash-input"
            id="password"
            name="password"
            type="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
          />
        </div>

        <button class="splash-button" type="submit">
          <span class="btn_label">LOGIN</span>
          <span class="btn_arrow" aria-hidden="true">&rarr;</span>
        </button>
      </form>
    </div>

    <div class="bottom_band" aria-hidden="true">
      <div class="bottom_left">
        <div class="stripe"></div>
        <div class="wordmark">
          <span class="wordmark_asset">Supporting</span>
          <span class="wordmark_track">BOLD QUEST</span>
        </div>
      </div>
      <div class="bottom_right">
        <svg
          class="deco_mark"
          viewBox="0 0 160 60"
          aria-hidden="true"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g fill="none" stroke="rgba(0,0,0,0.45)" stroke-linecap="round" stroke-linejoin="miter">
            <path d="M12 30H104" stroke-width="2.4" />
            <path d="M30 22H104" stroke-width="1.6" opacity="0.8" />
            <path d="M30 38H104" stroke-width="1.6" opacity="0.8" />
            <path d="M92 12L146 30L92 48Z" stroke-width="2.2" />
            <path d="M104 30H136" stroke-width="1.6" opacity="0.85" />
            <path d="M20 30L30 22" stroke-width="1.4" opacity="0.7" />
            <path d="M20 30L30 38" stroke-width="1.4" opacity="0.7" />
          </g>
        </svg>
      </div>
    </div>
  </div>
{% endblock %}
