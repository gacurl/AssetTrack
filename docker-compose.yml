# assettrack/docker-compose.yml
services:
  assettrack-data-init:
    build: .
    user: "0:0"
    command:
      - sh
      - -c
      - mkdir -p /app/data && chown 100:101 /app/data && chmod 0750 /app/data
    volumes:
      - ./data:/app/data
    restart: "no"

  assettrack:
    build: .
    depends_on:
      assettrack-data-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    environment:
      ASSETTRACK_SECRET_KEY: ${ASSETTRACK_SECRET_KEY}
      ASSETTRACK_DB_PATH: ${ASSETTRACK_DB_PATH:-/app/data/assettrack.db}
      ASSETTRACK_SMTP_HOST: ${ASSETTRACK_SMTP_HOST}
      ASSETTRACK_SMTP_PORT: ${ASSETTRACK_SMTP_PORT}
      ASSETTRACK_SMTP_USERNAME: ${ASSETTRACK_SMTP_USERNAME}
      ASSETTRACK_SMTP_PASSWORD: ${ASSETTRACK_SMTP_PASSWORD}
      ASSETTRACK_SMTP_STARTTLS: ${ASSETTRACK_SMTP_STARTTLS}
      ASSETTRACK_SMTP_USE_SSL: ${ASSETTRACK_SMTP_USE_SSL}
      ASSETTRACK_RECEIPT_FROM_EMAIL: ${ASSETTRACK_RECEIPT_FROM_EMAIL}
      ASSETTRACK_RECEIPT_CC_EMAIL: ${ASSETTRACK_RECEIPT_CC_EMAIL}
      ASSETTRACK_DEMO_TOKENS: ${ASSETTRACK_DEMO_TOKENS}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
